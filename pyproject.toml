[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specdec"
version = "0.1.0"
description = "Measure the speculative-decoding break-even point on one GPU"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noor Mkdad" }]
dependencies = []

[project.scripts]
specdec = "specdec.cli:main"

[tool.setuptools.packages.find]
include = ["specdec*"]
